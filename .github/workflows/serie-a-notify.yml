name: Serie A Telegram Notifier

on:
  # Ogni 15 minuti, dalle 10:00 alle 22:45 UTC, nei giorni tipici di Serie A
  # (ven=5, sab=6, dom=0, lun=1). Orari in UTC: in inverno (CET) equivalgono
  # alle 11:00-23:45 italiane, in estate (CEST) alle 12:00-00:45.
  # Se giocano anche altri giorni (recuperi infrasettimanali), aggiungi il
  # numero del giorno mancante nell'ultimo campo, oppure lancia a mano con
  # "Run workflow" qui su GitHub Actions.
  schedule:
    - cron: "*/15 10-22 * * 0,1,5,6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: serie-a-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py

      - name: Salva lo stato aggiornato nel repo
        run: |
          git config user.name "fantacalcio-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna stato notifiche [skip ci]"
            git push
          else
            echo "Nessuna modifica allo stato da salvare."
          fi
